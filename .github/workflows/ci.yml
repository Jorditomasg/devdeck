# =============================================================================
# DevDeck — CI (push to master)
# =============================================================================
# The release workflow (build-and-sign.yml) triggers only on v* tags, so
# without this job (a) tests only ever ran at release time, and (b) no cache
# was ever SAVED on master — the release runs restored nothing and compiled
# cold every time (Actions caches are only shared from the default branch).
#
# This job provides the continuous signal (i18n parity, frontend tests,
# madge cycles, cargo test — deliberately skipped in the release path) and
# warms the npm + cargo-registry caches via the shared-key the release jobs
# also use. Note: the release-profile Rust COMPILE stays cold by design —
# warming it would mean a full --release build on every push (not worth it).

name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shared-key: release-windows
          - os: ubuntu-22.04
            shared-key: release-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.shared-key }}

      # Same list as the release build-linux job (Tauri 2 system deps).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file wget

      - name: Install frontend dependencies
        run: npm ci

      - name: i18n key parity (en/es)
        run: npm run check:i18n

      - name: Circular dependency check
        if: runner.os == 'Linux'
        run: npm run check:cycles

      - name: Frontend tests
        run: npm test

      # tauri-build's build.rs validates that frontendDist exists, so the
      # Angular build must precede any cargo compile.
      - name: Build Angular frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
